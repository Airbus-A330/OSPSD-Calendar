[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendar-contract"
version = "0.1.0"
description = "Provider-independent shared Calendar contract for OSPSD Teams 2, 5, and 7."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12.5,<3",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.15.9",
]

[tool.uv]
required-version = ">=0.12.17"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_contract"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
